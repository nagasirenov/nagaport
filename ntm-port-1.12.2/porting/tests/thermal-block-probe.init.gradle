// Complete thermal block/model native compile. Does not alter source sets or compileJava.
allprojects {
    afterEvaluate {
        tasks.create('checkPortThermalBlockSource', Exec) {
            commandLine project.findProperty('portPython') ?: 'python3', project.file('porting/tests/thermal-block-source-test.py')
        }
        tasks.create('testPortThermalBlocks', Exec) {
            dependsOn 'checkPortThermalBlockSource'
            commandLine project.findProperty('portPython') ?: 'python3', project.file('porting/tests/thermal-block-native-probe.py'),
                '--java-home', project.findProperty('portJavaHome') ?: System.getProperty('java.home'),
                '--classpath', project.tasks.getByName('compileJava').classpath.asPath
        }
    }
}
