buildscript {
	repositories {
		maven { url = 'https://maven.minecraftforge.net/' }
		mavenCentral()
	}
	dependencies {
		classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT'
	}
}

apply plugin: 'net.minecraftforge.gradle.forge'

group = 'com.hbm'
version = mod_version
archivesBaseName = 'HBM-NTM'

sourceCompatibility = targetCompatibility = '1.8'
compileJava.options.encoding = 'UTF-8'

minecraft {
	version = '1.12.2-14.23.5.2768'
	runDir = 'run'
	mappings = 'stable_39'
}

// This optional integration uses the user-supplied, pinned real release JAR.
// Fail before dependency resolution rather than falling back to an unapproved mirror.
def ae2LocalJar = file('.local-dependencies/maven/appeng/appliedenergistics2/rv6-stable-7/appliedenergistics2-rv6-stable-7.jar')
if (!ae2LocalJar.isFile()) {
	throw new GradleException('Missing local AE2 dependency. Run: python3 porting/install-ae2-dependency.py /path/to/appliedenergistics2-rv6-stable-7.jar')
}

repositories {
	maven { url = uri('.local-dependencies/maven') }
	maven { url = 'https://modmaven.dev/' }
	maven { url = 'https://maven.cil.li/' }
}

dependencies {
	deobfProvided 'appeng:appliedenergistics2:rv6-stable-7'
	deobfCompile 'codechicken:NotEnoughItems:1.12.2-2.4.3.245:universal'
	// Native recipe API, pinned to the version already resolved by this NEI release.
	deobfCompile 'mezz.jei:jei_1.12.2:4.12.0.216'
	deobfCompile 'li.cil.oc:OpenComputers:MC1.12.2-1.7.5.192:api'
}

processResources {
	inputs.property 'version', project.version
	inputs.property 'mcversion', project.minecraft.version

	filesMatching('mcmod.info') {
		expand([
			version: project.version,
			credits: project.credits
		])
	}
}
